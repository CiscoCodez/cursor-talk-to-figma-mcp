name: Sync upstream safely

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out enhanced fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Merge Grab's latest main branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/grab/cursor-talk-to-figma-mcp.git
          git fetch upstream main
          git merge --no-edit upstream/main

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify enhanced build
        run: bun run build

      - name: Push verified update
        run: git push origin main
